# Runs every test on each pull request and on main, so "merge once the checks pass" is checked by GitHub.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test tools
        run: |
          pip install playwright reportlab Pillow astral
          python -m playwright install --with-deps chromium
      - name: Run all tests
        run: python tools/run_tests.py
