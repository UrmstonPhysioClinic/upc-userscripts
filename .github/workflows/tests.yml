# Runs every test on each pull request, so "merge once the checks pass" is checked by GitHub. Not again on main after
# the merge (CH, 24 Nov 2026): the pull request's run tested the same code, and a private repository's Actions minutes
# are limited. It can still be run by hand (Actions > tests > Run workflow).
# The tests are split into four groups of about three minutes each, run at the same time on separate machines,
# balanced by how long each folder takes (six groups until the slow tests got a fake clock, 24 Nov 2026: each machine
# takes about 35 seconds to set up, and a private repository's Actions minutes are counted per machine). Every test
# folder must be in exactly one group: the "all tests in a group" job checks that. tools/run_tests.py fails a group
# that runs over its time (tests/budgets.txt), so slow tests are caught as they creep in: move a folder to a quicker
# group, or make the test quicker (tests/fakeclock.py).
name: tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - health-check review-requests portal-fill appointment-reminders charge-excess alerts old-balances task-stamps
          - patient-forms clinic-settings missing-details calendar-controls script-settings core record-retention arrived-button
          - loader feedback-alerts ready-to-bill outstanding-actions bank-statement invoice-funder open-ended-patients block-reporting branding
          - patient-statuses forecourt-lights rebate-sync remittances insurer-payments-due to-do cards-on-file email-html mobile-layout
    name: tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test tools
        run: |
          pip install playwright reportlab Pillow astral
          python -m playwright install --with-deps chromium
      - name: Run this group's tests
        run: python tools/run_tests.py ${{ matrix.group }}
  every-test-in-a-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every test folder is in a group
        run: |
          python3 - <<'EOF'
          import pathlib, re
          wf = pathlib.Path('.github/workflows/tests.yml').read_text()
          groups = ' '.join(re.findall(r'^          - ([a-z0-9 -]+)$', wf, re.M)).split()
          folders = sorted(p.name for p in pathlib.Path('tests').iterdir() if p.is_dir() and not p.name.startswith(('.', '_')) and list(p.glob('test_*.py')))
          missing = [f for f in folders if f not in groups]
          twice = sorted({g for g in groups if groups.count(g) > 1})
          print('missing:', missing, 'twice:', twice)
          assert not missing and not twice
          EOF
