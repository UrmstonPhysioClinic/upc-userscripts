# Runs every test on each pull request and on main, so "merge once the checks pass" is checked by GitHub.
# The tests are split into six groups of about four minutes each, run at the same time on separate machines (CH,
# 24 Nov 2026: balanced by how long each folder takes). Every test folder must be in exactly one group: the "all tests
# in a group" job checks that. tools/run_tests.py fails a group that runs over its time (tests/budgets.txt), so slow
# tests are caught as they creep in: move a folder to a quicker group, or make the test quicker (a fake clock).
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - portal-fill charge-excess cards-on-file email-html
          - bank-statement appointment-reminders core branding
          - remittances clinic-settings ready-to-bill script-settings old-balances block-reporting
          - invoice-funder forecourt-lights review-requests outstanding-actions to-do mobile-layout
          - open-ended-patients loader feedback-alerts missing-details insurer-payments-due record-retention arrived-button
          - health-check patient-forms patient-statuses rebate-sync calendar-controls alerts task-stamps
    name: tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test tools
        run: |
          pip install playwright reportlab Pillow astral
          python -m playwright install --with-deps chromium
      - name: Run this group's tests
        run: python tools/run_tests.py ${{ matrix.group }}
  every-test-in-a-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every test folder is in a group
        run: |
          python3 - <<'EOF'
          import pathlib, re
          wf = pathlib.Path('.github/workflows/tests.yml').read_text()
          groups = ' '.join(re.findall(r'^          - ([a-z0-9 -]+)$', wf, re.M)).split()
          folders = sorted(p.name for p in pathlib.Path('tests').iterdir() if p.is_dir() and not p.name.startswith(('.', '_')) and list(p.glob('test_*.py')))
          missing = [f for f in folders if f not in groups]
          twice = sorted({g for g in groups if groups.count(g) > 1})
          print('missing:', missing, 'twice:', twice)
          assert not missing and not twice
          EOF
